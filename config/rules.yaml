# ═══════════════════════════════════════════════════════════════
# Wheel Strategy Rules — Master Configuration
# ═══════════════════════════════════════════════════════════════
# Single source of truth for all parameters. Tweak here, reload.
# Loaded by: src/config.py → all scripts and scoring engines.
# ═══════════════════════════════════════════════════════════════

# ── Market Regime Classification ──
regime:
  # VIX thresholds (aligned with standard VIX interpretation)
  # Below 12: Extreme complacency | 12-20: Normal/healthy | 20-30: Anxiety/elevated | Above 30: Panic
  vix:
    complacent: 12   # below = BULLISH (extreme calm, premium is cheap but safe)
    normal: 20       # below = NEUTRAL (healthy, balanced premium selling)
    elevated: 25     # below = CAUTIOUS (rising fear, reduce exposure)
    high: 30         # below = VOLATILE, above = BEARISH (panic, no new positions)

  # Position size multiplier per regime
  position_mult:
    BULLISH: 0.80    # UNVALIDATED — capped from 1.0: sub-15 VIX is the asymmetric jump-risk zone
                     # (loss-management-playbook.md §7, Decision #9, 2026-07-17). Backtest pending.
    NEUTRAL: 0.75    # 75% size
    CAUTIOUS: 0.50   # 50% size
    VOLATILE: 0.25   # 25% size
    BEARISH: 0.0     # no new positions

  # Cash reserve minimum (% of net liquidation)
  cash_reserve_pct:
    BULLISH: 0.15
    NEUTRAL: 0.20
    CAUTIOUS: 0.25
    VOLATILE: 0.30
    BEARISH: 0.35

  # CSP-to-CC ratio guidance
  csp_cc_ratio:
    BULLISH: [60, 40]
    NEUTRAL: [50, 50]
    CAUTIOUS: [30, 70]
    VOLATILE: [10, 90]
    BEARISH: [0, 100]

# ── Option Selection Parameters ──
options:
  # Delta ranges per strategy and regime
  delta:
    csp:
      BULLISH:     [0.20, 0.30]
      NEUTRAL:     [0.20, 0.30]
      CAUTIOUS:    [0.15, 0.25]
      VOLATILE:    [0.10, 0.20]
      BEARISH:     [0, 0]           # no CSPs
    cc:
      BULLISH:     [0.20, 0.30]
      NEUTRAL:     [0.20, 0.30]
      CAUTIOUS:    [0.25, 0.35]
      VOLATILE:    [0.30, 0.40]
      BEARISH:     [0.25, 0.35]     # existing positions only

  # DTE ranges
  dte:
    screen_min: 7         # minimum DTE to screen
    screen_max: 90        # maximum DTE to screen
    optimal_min: 30       # sweet spot minimum
    optimal_max: 45       # sweet spot maximum
    penalty_start: 21     # DTE below this gets penalty
    weekly_max: 14        # DTE below this gets weekly penalty
    hard_block: 7         # DTE below this = hard block
    long_start: 60        # DTE above this gets long penalty

  # Return on Capital minimums (%)
  roc_min:
    csp: 12.0
    cc: 8.0

  # IV Rank
  iv_rank_min: 30

  # Liquidity filters
  liquidity:
    open_interest_min: 500
    volume_min: 10
    bid_ask_spread_max_pct: 5.0

  # Earnings blackout
  earnings:
    blackout_days: 14

# ── Scoring Weights ──
scoring:
  weights:
    technical: 0.25
    options_quality: 0.25
    fundamental: 0.15
    external_sentiment: 0.20
    macro_risk: 0.15

  # Contract penalty adjustments
  contract_penalty:
    dte_optimal_bonus: -0.5      # 30-45 DTE bonus
    dte_intermediate_penalty: 0.5 # 21-30 DTE slight penalty
    dte_short_penalty: 1.5        # 14-21 DTE penalty
    dte_weekly_penalty: 3.0       # 7-14 DTE penalty
    dte_hard_block: 99            # < 7 DTE block
    dte_long_penalty: 1.0         # > 60 DTE penalty
    low_oi_penalty: 1.5           # OI < 100
    medium_oi_penalty: 0.5        # OI < 500
    wide_spread_penalty: 2.0      # spread > 5%
    medium_spread_penalty: 1.0    # spread > 2%
    low_volume_penalty: 1.0       # volume < 50
    min_volume_penalty: 2.0       # volume < volume_min
    low_delta_penalty: 0.5        # delta < 0.15
    high_roc_bonus: -1.5          # RoC > 24%
    medium_roc_bonus: -0.8        # RoC > 18%
    low_roc_bonus: -0.3           # RoC > 15%
    high_iv_bonus: -0.5           # IV > high_iv_threshold
    high_iv_threshold: 35         # IV above this = elevated premium bonus

# ── Position Sizing Hard Limits ──
position_limits:
  max_single_position_pct: 0.15     # 15% max per underlying (GOAL.md hard limit — restored from 0.75 testing override)
  max_sector_pct: 0.25              # 25% max per sector
  max_csp_deployed_pct: 0.25        # 25% of net liq in CSP (normal)
  max_csp_deployed_volatile_pct: 0.10  # 10% in volatile regime
  max_open_positions: 8             # max active CC/CSP options only (wheel strategy bandwidth)
  max_daily_new_positions: 2        # new trades per day
  max_margin_pct: 0.30              # 30% margin utilization max
  csp_capital_coverage: 1.0         # must cover 100% of CSP notional with cash+BP
  bp_margin_buffer: 0.50            # 50% of buying power available as margin buffer
  cash_buffer_warn: 0.25            # cash buffer below this = warning
  cash_buffer_critical: 0.10        # cash buffer below this = block new trades

# ── CSP Pause Triggers ──
csp_pause:
  vix_above: 25
  spy_below_sma: 200
  regime_min_score: -2          # VOLATILE or worse
  cash_reserve_below_pct: 0.20
  stock_drop_from_basis_pct: 0.15  # per-ticker pause

# ── Stop Loss (Layered) ──
stop_loss:
  # Layer 1: Premium multiple stops, DTE-adjusted
  # Loss = (current_bid - entry_premium) × qty × 100 for short options
  premium_stop:
    far_dte: 30          # > 30 DTE — time to recover
    mid_dte: 21          # 21-30 DTE — rolling window
    far_alert: 2.0       # alert at 2× premium lost
    far_close: 3.0       # close at 3× premium lost
    mid_alert: 1.0       # alert at 1× premium lost
    mid_close: 2.0       # close at 2× premium lost, consider rolling
    near_alert: 0.5      # alert at 0.5× premium lost (< 21 DTE)
    near_close: 1.5      # close at 1.5× premium lost

  # Layer 2: Delta gates (absolute value)
  delta:
    csp_critical: 0.60   # CSP |Δ| > 0.60 → too directional, cut it
    csp_itm: 0.50        # CSP |Δ| ≥ 0.50 → deep ITM, assignment imminent
    csp_decision: 0.40   # CSP |Δ| ≥ 0.40 → "decision time": plan roll / take assignment / exit
    cc_critical: 0.50    # CC Δ > 0.50 → prepare for assignment
    cc_warn: 0.40        # CC Δ > 0.40 → monitor closely

# ── Rolling Discipline (UNVALIDATED — backtest pending, playbook §3) ──
rolling:
  net_credit_only: true            # never pay a debit to roll (GOAL.md §6)
  max_rolls_per_campaign: 2        # more than 2 rolls = broken thesis, not bad luck
  min_extension_days: 30           # rolling weeklies churns commissions
  broken_if_credit_requires_dte_gt: 90   # only a 90+ DTE roll gets a credit → close instead

# ── Holdings Exit Framework (UNVALIDATED — backtest pending, playbook §4-§6) ──
# The stock-leg loss rules: thesis-break exits + price backstops + capacity math.
holdings_exit:
  # Decision #10 policy: ≤ dead_zone: never CC below basis (unchanged).
  # > dead_zone: thesis gates decide — broken → EXIT signal; intact → surface
  # hold-unencumbered vs flagged below-basis CC choice. Engine never auto-sells.
  dead_zone_drop_pct: 0.15         # >15% below adjusted basis = dead zone (basis-strike CC pays ~0)
  backstop_conditional_pct: 0.30   # exit signal at -30% IF below 200 SMA with negative slope
  backstop_hard_pct: 0.40          # unconditional circuit breaker at -40% from adjusted basis
  months_to_recover_flag: 12       # gap / monthly premium > 12 months → REDEPLOY review
  time_stop_months: 12             # stagnant this long → compare vs premium-yield alternative

  # Thesis-break gates (codable on quarterly fundamentals; playbook §5)
  thesis:
    growth_stall_quarters: 2       # consecutive quarters of negative YoY revenue growth
    decel_quarters: 3              # consecutive quarters of BOTH rev+EPS growth deceleration
    gross_margin_drop_bps: 100     # gross margin drop over 2 years (with 3 declining quarters)
    debt_ebitda_max: 4.5           # Debt/EBITDA above this = balance-sheet stress
    fcf_yield_min_pct: 2.0         # FCF yield below this + net capital raising = cash-flow break
    broken_min_gates: 2            # thesis BROKEN if ≥2 gates fail (growth stall alone also breaks)

# ── CC Management ──
cc_management:
  never_sell_below_cost_basis: true
  close_at_profit_pct: 0.50
  roll_dte_threshold: 21
  pause_cc_if_drop_pct: 0.25    # stock > 25% below cost basis

# ── Trend-Modulated Profit Booking (specs/profit-loss-management-spec.md) ──
# The exit layer is the last place the rich signal stack (trend/sentiment/IV)
# is applied. CSP trend extension raises the 50% target when the stock is
# running AWAY from the short put; CC never extends (uptrend runs INTO a short
# call) but rolls up-and-out to keep shares. Hard gates (21 DTE, capital
# scarcity, earnings) override every extension.
profit_take:
  csp:
    base_pct: 50                       # Tastytrade base (unconditional)
    strong_trend_target_pct: 85        # TREND ≥ 70 + sentiment BULLISH/NEUTRAL + IVR ≥ 30
    trend_target_pct: 70              # TREND ≥ 50 + sentiment BULLISH/NEUTRAL
    trend_extension_enabled: true     # CSP: trend raises target (stock runs away from strike)
  cc:
    base_pct: 50                       # CC never extends a short call in an uptrend
    trend_extension_enabled: false    # uptrend is the DANGER side for CC
    roll_up_out_on_trend: true        # close + roll up-and-out for credit when TREND ≥ 50
  trend_inputs:
    strong_trend_composite_min: 70
    trend_composite_min: 50
    sentiment_direction_allow: [BULLISH, NEUTRAL]
    iv_rank_min: 30
  # Final gates (hard — override every extension above)
  dte_floor: 21                        # ≤ 21 DTE → manage today (gamma floor)
  capital_scarcity_override: SCARCE   # SCARCE capital → book at base 50%
  # Loss-side: trend-aware overlay at the 2× premium alert (no threshold changes)
  loss_alert_trend_overlay:
    trend_composite_hard_stop_min: 40  # trend < 40 at 2× alert → treat as hard stop
    max_extra_roll_attempts: 1        # trend ≥ 40 → one roll attempt, then forced decision

# ── Watchlist (default fallback) ──
watchlist:
  # Moomoo watchlist group to pull live tickers from
  moomoo_group: Options

  default:
    - US.V
    - US.MSFT
    - US.GOOGL
    - US.AAPL
    - US.AMZN
    - US.NVDA
    - US.META
    - US.AVGO
    - US.CRM
    - US.AMD
    - US.TSLA
    - US.BE

  # Non-tech diversification candidates
  diversify:
    financial:    [US.JPM, US.BAC, US.GS]
    healthcare:   [US.ABBV, US.JNJ, US.UNH]
    consumer:     [US.KO, US.WMT, US.PG]
    energy:       [US.XOM, US.CVX]
    industrial:   [US.CAT, US.GE, US.HON]

# ── Thesis Validation ──
# Systematic thesis checks to prevent trading drift.
# Runs weekly (Monday 9AM) on all positions.
thesis_validation:
  enabled: true
  check_frequency: weekly  # monday 9am

  # Earnings estimate revision thresholds (percent)
  earnings_revision_threshold: -20   # CRITICAL if cuts >20%
  revenue_guidance_threshold: -15    # CRITICAL if guidance cut >15%

  # Fundamental health minimums
  fundamental_score_minimum: 3       # 1-10 scale, below = CRITICAL

  # P/E valuation thresholds — high-growth stocks naturally carry high P/E.
  # Tune these rather than relying on hardcoded defaults.
  pe_ratio_warning: 50               # DAMAGED if P/E above this
  pe_ratio_critical: 100             # BROKEN if P/E above this
  pe_negative_critical: true         # BROKEN if P/E < 0 (company losing money)

  # Wheel eligibility (daily check) — the watchlist is the master list; this
  # read-only filter auto-skips clear loss-makers so they never get screened.
  # Uses moomoo snapshot data only (net_profit + eps_ttm) — no yfinance needed.
  unprofitable_block: true           # skip when net_profit < 0 AND eps_ttm < 0

  # Trusted tickers skip the P/E check entirely (you accept their valuation).
  # Other checks (earnings, SMA, volatility, price perf) still apply.
  trusted_tickers: [AMD, TSLA, PLTR]

  # Do-Not-Wheel auto-removal: when a re-validated ticker's thesis recovers to
  # this status or better, it is removed from the exclusion list early instead
  # of waiting out the full months-long expiry.
  recovery_status_for_removal: INTACT   # INTACT (default) or DAMAGED

  # Technical damage thresholds (percent below 200 SMA)
  price_vs_200sma_threshold: -15     # WARNING if >15% below
  price_vs_200sma_critical: -25      # CRITICAL if >25% below

  # Volatility regime check
  volatility_elevated_threshold: 100  # HV percent, above = WARNING

  # Price performance thresholds (percent off 52-week high)
  price_perf_warning: -25            # WARNING if >25% off highs
  price_perf_critical: -40           # CRITICAL if >40% off highs

# ── Automatic Exit Conditions ──
# When these fire, the position should be closed (not rolled).
auto_exit_triggers:
  thesis_broken: true                # auto-exit if thesis validation returns BROKEN
  concentration_exceeded: true       # block new, let existing expire
  earnings_imminent: true            # close before earnings if DTE spans earnings

  earnings_lookahead_days: 14        # blackout window before earnings
  auto_close_before_earnings: true   # auto-close options spanning earnings

# ── Systematic Timeline ──
# Enforces weekly/monthly reviews, eliminates daily decisions.
schedule:
  daily_status: "09:00"              # status check only, no decisions
  weekly_thesis: "Monday 09:00"      # thesis validation + auto-exit if broken
  monthly_guardrail: "01 09:00"      # guardrail review (1st of month)
  expiry_processing: "Friday 16:00"  # process expirations, handle assignments

# ── Guardrail Operational Limits ──
# Operational limits for the guardrails module (src/guardrails/limits.py).
# Separate from position_limits above which governs risk/capital constraints.
guardrail_limits:
  max_position_pct_emergency: 0.15   # emergency: reduce concentration
  max_sector_pct_emergency: 0.40     # emergency: accept temporary concentration
  max_position_pct_target: 0.25      # target: reasonable for quality stocks
  max_sector_pct_target: 0.35        # target: allows natural concentration
  max_position_pct_quality: 0.30     # comfort: for exceptional quality (V, AAPL)

  # CSP deployment limits (cash-buffer based)
  max_csp_liability_critical: 0.15   # ≤10% cash buffer
  max_csp_liability_warning: 0.25    # ≤15% cash buffer
  max_csp_liability_target: 0.35     # ≤20% cash buffer
  max_csp_liability_comfort: 0.50    # ≥30% cash buffer

  # Cash buffer thresholds
  cash_buffer_critical: 0.10         # below = emergency
  cash_buffer_warning: 0.15          # below = minimum acceptable
  cash_buffer_target: 0.20           # good buffer
  cash_buffer_comfort: 0.30          # strong buffer

  # Complexity limits
  max_total_positions_emergency: 10  # emergency: accept current level
  max_total_positions_target: 8      # target: manageable
  max_monthly_orders_emergency: 20   # emergency: progress from 40
  max_monthly_orders_target: 10      # target: true Wheel frequency
