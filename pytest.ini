[pytest]
# Pytest configuration for options trading framework

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum version
minversion = 7.0

# Add current directory to Python path
pythonpath = .

# Coverage options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    # -m "not slow"  # Skip slow tests by default

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    infrastructure: marks tests as infrastructure tests
    performance: marks tests as performance tests
    security: marks tests as security tests
    requires_moomoo: marks tests that require Moomoo API access
    requires_yfinance: marks tests that require YFinance API access
    requires_database: marks tests that require database access

# Logging options
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout configuration
timeout = 300
timeout_method = thread

# Coverage configuration
[coverage:run]
source = src
omit =
    */tests/*
    */__pycache__/*
    */migrations/*
    .venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov